<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RSLauncher - Helios 기반 Minecraft Java Edition 런처">
  <title>RSLauncher</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f7fbff; background: radial-gradient(circle at top, #244a6b, #101821 58%); }
    main { width: min(720px, calc(100% - 32px)); padding: 48px; border: 1px solid #ffffff22; border-radius: 24px; background: #0b1119cc; box-shadow: 0 24px 80px #0008; }
    h1 { margin: 0 0 12px; font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: -.05em; }
    p { color: #c9d6e2; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0; }
    a { color: #92ccff; }
    .button { padding: 12px 18px; border-radius: 10px; color: #081019; background: #8fcbff; text-decoration: none; font-weight: 700; }
    .button.secondary { color: #eaf5ff; background: #ffffff16; }
    small { color: #8da0b2; }
  </style>
</head>
<body>
  <main>
    <h1>RSLauncher</h1>
    <p>Helios를 기반으로 제작한 Minecraft Java Edition 데스크톱 런처입니다. Microsoft 계정 로그인과 게임 파일 관리를 지원합니다.</p>
    <div class="actions">
      <a class="button" href="https://github.com/rain10294/RSLauncher/releases/latest/download/RSLauncher-setup-Windows.exe">Windows용 다운로드</a>
      <a class="button secondary" href="https://github.com/rain10294/RSLauncher">소스 코드</a>
      <a class="button secondary" href="https://github.com/rain10294/RSLauncher/blob/main/PRIVACY.md">개인정보 처리 안내</a>
    </div>
    <small>RSLauncher는 Microsoft, Mojang Studios 또는 Minecraft의 공식 제품이 아닙니다.</small>
  </main>
</body>
</html>
