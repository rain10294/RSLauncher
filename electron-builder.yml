appId: 'kr.rslauncher.launcher'
productName: 'RSLauncher'
artifactName: '${productName}-setup-Windows.${ext}'

copyright: 'Copyright © 2026 RSLauncher contributors'

asar: true
compression: 'maximum'

# Generate electron-updater metadata for the public GitHub release feed.
publish:
  - provider: 'generic'
    url: 'https://github.com/rain10294/RSLauncher/releases/latest/download/'
    publishAutoUpdate: true

files:
  - '!{dist,dist-client-id,release,artifacts,profile-builder,whitelist-service,auth-helper,scripts,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'
  - from: 'auth-helper/publish'
    to: 'auth-helper'
    filter:
      - '**/*'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'RSLauncher contributors'
  vendor: 'RSLauncher'
  synopsis: 'RSLauncher Minecraft Launcher'
  description: 'Helios 기반 RSLauncher. 게임 파일, Java 런타임, 서버 구성을 자동으로 관리합니다.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'
