name: Build and Release Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rslauncher-windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Prepare release asset
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $source = "dist/RSLauncher-setup-$version.exe"
          $asset = "dist/RSLauncher-setup-Windows.exe"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Windows installer was not created: $source"
          }
          Copy-Item -LiteralPath $source -Destination $asset -Force
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Publish latest Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $asset = "${{ steps.release.outputs.asset }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --title "RSLauncher $version" --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset `
              --target $env:GITHUB_SHA `
              --title "RSLauncher $version" `
              --generate-notes `
              --latest `
              --repo $env:GITHUB_REPOSITORY
          }
