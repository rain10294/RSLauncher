name: Build and Release Windows

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'auth-helper/**'
      - 'build/**'
      - 'libraries/**'
      - 'scripts/build-auth-helper.ps1'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
  workflow_dispatch:

concurrency:
  group: rslauncher-windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install Dependencies
        run: npm ci

      - name: Bump launcher version
        id: version
        shell: pwsh
        run: |
          $current = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $parts = $current.Split('.')
          if ($parts.Count -ne 3) {
            throw "Launcher version must use major.minor.patch: $current"
          }

          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2] + 1
          if ($patch -ge 10) {
            $minor += 1
            $patch = 0
          }

          $version = "$major.$minor.$patch"
          npm version $version --no-git-tag-version
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update launcher version to $version"
          }

          "tag=v$version" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: npm run dist:win

      - name: Prepare release asset
        id: release
        shell: pwsh
        run: |
          $asset = "dist/RSLauncher-setup-Windows.exe"
          $blockmap = "$asset.blockmap"
          $metadata = "dist/latest.yml"
          foreach ($requiredFile in @($asset, $blockmap, $metadata)) {
            if (-not (Test-Path -LiteralPath $requiredFile)) {
              throw "Auto-update file was not created: $requiredFile"
            }
          }
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "blockmap=$blockmap" >> $env:GITHUB_OUTPUT
          "metadata=$metadata" >> $env:GITHUB_OUTPUT

      - name: Record launcher version
        id: source
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump launcher version to $version [skip ci]"
          git push origin HEAD:main
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Publish latest Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $asset = "${{ steps.release.outputs.asset }}"
          $blockmap = "${{ steps.release.outputs.blockmap }}"
          $metadata = "${{ steps.release.outputs.metadata }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset $blockmap $metadata --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --title "RSLauncher $version" --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset $blockmap $metadata `
              --target "${{ steps.source.outputs.sha }}" `
              --title "RSLauncher $version" `
              --generate-notes `
              --latest `
              --repo $env:GITHUB_REPOSITORY
          }
